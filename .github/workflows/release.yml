# Builds the .vsix and attaches it to a GitHub release.
#   git tag v0.1.1 && git push origin v0.1.1      (the tag must match "version" in package.json)
# A tag push also publishes: to the VS Code Marketplace when the VSCE_PAT secret is set, and to Open VSX
# when OVSX_PAT is set. With VSCE_PAT the GitHub release is a full release, without it a pre-release.
# Running the workflow by hand (Actions, release, Run workflow) only builds and updates the GitHub
# pre-release for the current package.json version; it never publishes.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.vsix --clobber
          else
            gh release create "$tag" dist/*.vsix --target "$GITHUB_SHA" --title "Pelago for VS Code $version" \
              --notes "Install: Extensions view, ... menu, Install from VSIX. Changes: see CHANGELOG.md." --prerelease
          fi
      - name: Publish to the VS Code Marketplace
        if: github.ref_type == 'tag' && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath dist/*.vsix
      - name: Publish to Open VSX
        if: github.ref_type == 'tag' && env.OVSX_PAT != ''
        run: npx ovsx@1.3.0 publish dist/*.vsix -p "$OVSX_PAT"
      - name: Mark the GitHub release as a full release
        if: github.ref_type == 'tag' && env.VSCE_PAT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false
